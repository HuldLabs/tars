# Release do Tars — publicacao por PADRAO em toda tag `v*`.
#
# O que faz (fatia 2a, item 1):
#   1. compila o binario `tars` para linux amd64 e arm64 (`bun build --compile`, sem Node no
#      consumidor);
#   2. anexa os binarios + `sha256sums` a GitHub Release da tag;
#   3. publica `ghcr.io/huldlabs/tars:<versao>` multi-arch com SO' o binario (base minima —
#      ver `.github/release.Dockerfile`: o `--compile` do Bun nao emite estatico de verdade,
#      entao `FROM scratch` nao roda; a base e' `debian:bookworm-slim`, glibc como o consumidor).
#
# A versao vem da TAG (`v0.0.1-dev.18` -> `0.0.1-dev.18`); o binario embute o catalogo
# (`.ai/` + `templates/`) e roda num ambiente SEM checkout e SEM `TARS_HOME` (fatia 2a, item 2).
#
# Nada de segredo alem do `GITHUB_TOKEN`: o job publica no proprio repo (Release) e no GHCR
# (`packages: write`). O `id-token` alimenta a atestacao de procedencia (SLSA) das imagens.
name: Release

on:
  push:
    tags:
      - "v*"

# `contents: write` para criar a Release; `packages: write` para o GHCR; `id-token: write`
# para o `provenance: true` do build-push-action assinar a atestacao.
permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/huldlabs/tars

jobs:
  # Compila os DOIS alvos numa matriz e sobe cada um como artefato do workflow. `bun build
  # --compile --target` faz cross-compile a partir do runner amd64 (o arm64 sai do binario
  # embutido do Bun) — sem runner arm64 e sem QEMU na etapa de build.
  binario:
    name: binario ${{ matrix.alvo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc: Ubuntu/WSL/Debian e a imagem OCI. musl: containers Alpine. Cada binario
          # e' PROVADO rodando na sua libc e arquitetura (QEMU para o arm64), nunca so' compilado.
          - alvo: linux-x64
            bun: bun-linux-x64
            out: tars-linux-amd64
            prova: debian:bookworm-slim
            plat: linux/amd64
          - alvo: linux-arm64
            bun: bun-linux-arm64
            out: tars-linux-arm64
            prova: debian:bookworm-slim
            plat: linux/arm64
          - alvo: linux-x64-musl
            bun: bun-linux-x64-musl
            out: tars-linux-amd64-musl
            prova: alpine:3.20
            plat: linux/amd64
          - alvo: linux-arm64-musl
            bun: bun-linux-arm64-musl
            out: tars-linux-arm64-musl
            prova: alpine:3.20
            plat: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # a mesma do `packageManager`; o binario compilado a fixa

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Embutir o catalogo e compilar
        run: |
          set -euo pipefail
          # A versao da tag e' a fonte: o binario embute o catalogo e o `--version` responde.
          node tools/framework/tars-embed-catalog.mjs --tars . --out tools/framework/tars-embedded.mjs
          bun build --compile --target=${{ matrix.bun }} tools/framework/tars.mjs --outfile "${{ matrix.out }}"

      - name: Setup QEMU (prova do arm64)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Provar o binario (roda SEM checkout, SEM TARS_HOME, na libc do alvo)
        run: |
          set -euo pipefail
          # Tmpdir SEM `.ai/` acima, exatamente o asset da Release, rodado num container da
          # libc e da arquitetura do alvo. A primeira tentativa da dev.19 compilou musl e provou
          # no runner glibc: "No such file or directory" (loader ausente). Aqui cada binario
          # roda onde o consumidor dele roda; o alpine recebe a `libstdc++` que o Bun exige.
          dir="$(mktemp -d)"
          cp "${{ matrix.out }}" "${dir}/tars"
          chmod +x "${dir}/tars"
          versao="${GITHUB_REF_NAME#v}"
          prep=""
          case "${{ matrix.prova }}" in alpine*) prep="apk add --no-cache -q libstdc++ >/dev/null && " ;; esac
          saida="$(docker run --rm --platform "${{ matrix.plat }}" -v "${dir}:/t" -e TARS_EMBED_CACHE=/t/cache \
            "${{ matrix.prova }}" sh -c "${prep}/t/tars --version")"
          echo "${{ matrix.alvo }} respondeu: ${saida}"
          test "${saida}" = "${versao}" || { echo "esperava '${versao}'"; exit 1; }

      - name: Subir o binario como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 7

  # Baixa os dois binarios, gera o `sha256sums` e anexa tudo a Release da tag.
  release:
    name: GitHub Release
    # Por ULTIMO: so' publica depois dos binarios provados E da imagem provada pelo smoke.
    needs: [binario, imagem, imagem-smoke, upgrade-real]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a tag anterior entra no link de comparacao das notas

      - name: Baixar os binarios
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # SO' os binarios: sem filtro, o job baixava tambem o registro de build do Docker
          # (`*.dockerbuild`, do build-push-action), que nao extrai e derrubava a Release.
          pattern: tars-linux-*
          path: dist
          merge-multiple: true

      - name: Gerar o sha256sums
        run: |
          set -euo pipefail
          cd dist
          sha256sum tars-linux-amd64 tars-linux-arm64 tars-linux-amd64-musl tars-linux-arm64-musl > sha256sums
          cat sha256sums

      - name: Gerar as notas da Release (tars release-notes)
        run: |
          set -euo pipefail
          # As notas saem do CHANGELOG + artefatos (dono, 14/10): destaques, downloads com
          # sha256, imagem por digest, instalar, a secao do CHANGELOG, verificacao, comparacao.
          versao="${GITHUB_REF_NAME#v}"
          # o CLI importa o catalogo embutido (gerado, fora do git): gera antes, como o job binario.
          node tools/framework/tars-embed-catalog.mjs --tars . --out tools/framework/tars-embedded.mjs
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          node tools/framework/tars.mjs release-notes --version "${versao}" --dist dist \
            --image "${IMAGE}@${{ needs.imagem.outputs.digest }}" --repo "${GITHUB_REPOSITORY}" \
            --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            ${prev:+--prev "$prev"} --out notes.md
          head -40 notes.md

      - name: Anexar a Release da tag
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          # Versao com `-` (ex.: 0.0.1-dev.20) e' pre-release: nao vira a "Latest" do repo.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/tars-linux-amd64
            dist/tars-linux-arm64
            dist/tars-linux-amd64-musl
            dist/tars-linux-arm64-musl
            dist/sha256sums

  # Publica a imagem multi-arch (base glibc minima) com SO' `/tars`. Usa o `build-push-action`
  # com um Dockerfile embutido num contexto de uma linha: cada plataforma INJETA o binario
  # ja' compilado (nunca recompila no Docker) pela tag que o buildx resolve.
  # Upgrade REAL antes de publicar (dev.23): a versao anterior publicada num projeto, depois o
  # binario desta tag com `sync --upgrade`. Os bugs da dev.20/21 so' apareceram no consumidor.
  upgrade-real:
    name: upgrade real (versao anterior -> esta)
    needs: binario
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a tag anterior
      - name: Binario desta tag
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tars-linux-amd64
          path: novo
      - name: Upgrade da anterior para esta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")"
          echo "anterior: ${prev}"
          mkdir velho
          gh release download "${prev}" -R "${GITHUB_REPOSITORY}" -p tars-linux-amd64 -D velho
          chmod +x velho/tars-linux-amd64 novo/tars-linux-amd64
          bash tools/framework/tars-upgrade-real.sh velho/tars-linux-amd64 novo/tars-linux-amd64

  imagem:
    name: imagem OCI (ghcr.io/huldlabs/tars)
    needs: binario
    # O digest vai para as notas da Release (`COPY --from=...@sha256:`), nunca a tag movel.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Baixar os binarios
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # SO' os binarios: sem filtro, o job baixava tambem o registro de build do Docker
          # (`*.dockerbuild`, do build-push-action), que nao extrai e derrubava a Release.
          pattern: tars-linux-*
          path: dist
          merge-multiple: true

      - name: Normalizar os nomes (o Dockerfile espera `tars`)
        run: |
          set -euo pipefail
          cp dist/tars-linux-amd64 tars.amd64
          cp dist/tars-linux-arm64 tars.arm64

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login no GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE }}
          # Aqui a imagem e' CANDIDATA: so' `candidato-<sha>`. As tags de versao (`0.0.1-dev.N`,
          # `latest`) so' entram no job `imagem-tags`, DEPOIS da Release — senao o GHCR anuncia
          # uma versao cuja Release ainda pode falhar (Endurance, 14/10: dev.23 com imagem e sem Release).
          tags: |
            type=sha,prefix=candidato-,format=long

      - name: Build e push (multi-arch)
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: .github/release.Dockerfile
          # O buildx passa o SEU proprio layout de plataforma; o Dockerfile escolhe o binario
          # por `TARGETARCH` (amd64/arm64) — os dois vieram de artefatos ja' compilados.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

  # Smoke da imagem: confere que o manifest multi-arch existe e que o container amd64
  # responde `--version` com a versao da tag, provando a imagem de verdade.
  imagem-smoke:
    name: smoke da imagem
    needs: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login no GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: A imagem responde a versao da tag (sem checkout)
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME#v}"
          saida="$(docker run --rm "${IMAGE}@${{ needs.imagem.outputs.digest }}" --version)"
          echo "imagem respondeu: ${saida}"
          test "${saida}" = "${versao}" || { echo "esperava '${versao}'"; exit 1; }

  # So' depois da Release publicada: o digest provado ganha as tags de versao. Quem le o GHCR
  # (o gate do Endurance compara a maior tag) nunca ve uma versao sem Release.
  imagem-tags:
    name: imagem — tags de versao (depois da Release)
    needs: [imagem, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login no GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promover o digest as tags de versao
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          tags=(-t "${IMAGE}:${v}" -t "${IMAGE}:$(echo "$v" | cut -d. -f1-2)")
          case "$v" in *-*) ;; *) tags+=(-t "${IMAGE}:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${{ needs.imagem.outputs.digest }}"
          docker buildx imagetools inspect "${IMAGE}:${v}" --format '{{.Manifest.Digest}}'
