# Tars mypy preset for the Python stack (engineering-standards §5; owner 2026-11-20): strict, stable checker.
# ty (Astral) is faster but still Beta (0.0.x, 2026-11-20); re-evaluate when it reaches a stable release.
# Pin mypy with == in the dev group and run `uv run mypy <packages>` in the Python gate.
[mypy]
strict = True
warn_unreachable = True
# Pydantic consumers: uncomment so models type-check their fields and validators.
# plugins = pydantic.mypy

[mypy-tests.*]
# tests may call untyped fixtures; the public code is what must be strict
disallow_untyped_defs = False
