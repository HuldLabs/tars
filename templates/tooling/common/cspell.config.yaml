# Tars cspell preset (engineering-standards §5, skill cspell-curator). Own dictionaries are curated: fix the text
# first, `cspell trace <word>` before adding, never a dump. Run with every dictionary pinned, e.g.
#   npx -y -p cspell@10.4.1 -p @cspell/dict-pt-br@2.4.4 -p @cspell/dict-es-es@3.0.9 -p @cspell/dict-python@4.5.3 \
#     -p @cspell/dict-software-terms@5.4.9 -p @cspell/dict-shell@1.2.0 -p @cspell/dict-docker@1.1.17 \
#     cspell --no-progress --gitignore "**/*"
version: "0.2"
language: en,pt-BR,es
enableGlobDot: true
useGitignore: true
import:
  - "@cspell/dict-pt-br/cspell-ext.json"
  - "@cspell/dict-es-es/cspell-ext.json"
  - "@cspell/dict-python/cspell-ext.json"
  - "@cspell/dict-software-terms/cspell-ext.json"
  - "@cspell/dict-shell/cspell-ext.json"
  - "@cspell/dict-docker/cspell-ext.json"
ignorePaths:
  - ".git/**"
  - ".cache/**"
  - ".ai/base/**"
  - ".venv/**"
  - "node_modules/**"
  - "*.lock"
  # generated by `tars sync`
  - "AGENTS.md"
  - "CLAUDE.md"
  - ".githooks/**"
# Identifiers, not prose: file paths, quoted kebab ids, wikilinks, secret refs, pinned images, DOIs, snake_case.
ignoreRegExpList:
  - "/[\\w./-]*[\\w-]+\\.(md|py|toml|ya?ml|json|sh|txt|mjs|ts|tsx|sql|ini|lock)\\b/g"
  - "/[\"`][a-z0-9]+(?:-[a-z0-9]+)+[\"`]/g"
  - "/\\[\\[[a-z0-9-]+\\]\\]/g"
  - "/op:\\/\\/\\S+/g"
  - "/[\\w./-]+(?::[\\w.-]+)?@sha256:[0-9a-f]{64}/g"
  - "/\\b10\\.\\d{4,}\\/[^\\s)\"'`|]+/g"
  - "/\\b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\\b/g"
# cspell:disable -- the list below is the set of forbidden spellings itself
# Unaccented Portuguese is always a mistake in prose (code comments are in English anyway).
flagWords:
  - nao
  - tambem
  - possivel
  - padrao
  - versao
  - versoes
  - excecao
  - execucao
  - secao
  - opcao
# cspell:enable
dictionaryDefinitions:
  - name: project-words
    path: .cspell/project-words.txt
    addWords: true
dictionaries:
  - project-words
