default_permissions = "rulesync"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[mcp_servers.projects]
command = "docker"
args = [ "exec", "-i", "-u", "node", "-e", "DB_HOST=host.docker.internal", "-w", "/workspace", "node", "tools/framework/secrets.mjs", "exec", "--", "bun", "--conditions=react-server", "tools/framework/host/projects-mcp.ts" ]

[mcp_servers.projects.env]
MSYS_NO_PATHCONV = "1"

[permissions.rulesync]
extends = ":workspace"

[permissions.rulesync.filesystem]
":minimal" = "read"
glob_scan_max_depth = 8

[permissions.rulesync.filesystem.":workspace_roots"]
".git/**" = "write"
