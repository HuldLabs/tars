# Doutrina como DADO (docs/TARS.md; `tars doctor`).
#
# Cada item declara o par que ate' agora so' existia na cabeca de quem escreveu o hook:
#   fonte  — `arquivo:linha` onde a regra esta ESCRITA (a autoridade da prosa)
#   gate   — quem APLICA; `"nenhum"` e obrigatorio declarar, com `motivo` (orfao nomeado)
#   prova  — comando que REPROVA: se ele PASSA, a doutrina nao esta' sendo cobrada (PHANTOM)
#   onde   — pre-commit | commit-msg | pre-push | session-start | ci
#
# `escopo`: `catalogo` vale em todo consumidor (a prova roda aqui, na raiz do Tars);
# `segtools` descreve uma regra que so' o segtools tem — a prova roda no projeto dele e
# entra no `.ai/tars.toml` de la', nao aqui. O projeto sempre vence pelo `id`.
#
# Medido no relatorio do doctor (07/10): das 20 doutrinas, 11 tem gate, 4 tem gate de
# metade e 5 sao SEM GATE. As 4 orfas nomeadas abaixo sao divida, nao esquecimento.

# ---------------------------------------------------------------------------
# Catalogo — valem em qualquer consumidor
# ---------------------------------------------------------------------------

[[doctrine]]
id = "git/atomic-commit"
titulo = "Commit atomico, com pathspec explicito"
fonte = ".ai/governance/git.md:31-36"
gate = "../../.ai/gates/no-add-all"
prova = "printf '%s' '{\"hook_event_name\":\"PreToolUse\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git add -A\"}}' | node .ai/gates/no-add-all/no-add-all.mjs"
onde = "pre-commit"

[[doctrine]]
id = "git/commit-message"
titulo = "`<emoji> <type>(<scope>): <descricao>`, sujeito <= 72"
fonte = ".ai/gates/commit-msg/GATE.md:1-16"
gate = "../../.ai/gates/commit-msg"
prova = "printf 'sem emoji nem tipo\\n' > /tmp/tars-doc-msg.txt && node .ai/gates/commit-msg/gate.mjs /tmp/tars-doc-msg.txt"
onde = "commit-msg"

[[doctrine]]
id = "git/lesson-trailer"
