[[doctrine]]
id = "fail/erro-nao-se-engole"
titulo = "`catch {}` vazio e `except: pass` REPROVAM no staged (TARS-SWALLOW-1)"
fonte = ".ai/gates/lint-swallow/GATE.md:1-14"
gate = "../../.ai/gates/lint-swallow"
prova = "printf 'try { f() } catch {}\\n' > /tmp/tars-doc-swallow.mjs && node .ai/gates/lint-swallow/gate.mjs"
onde = "pre-commit"

[[doctrine]]
id = "gates/linha-de-base"
titulo = "Adocao com divida: a violacao VELHA entra na linha de base (`.ai/gates-baseline.json`); o gate reprova so` o que e' NOVO e a base so` encolhe (ratchet)"
fonte = "tools/framework/tars-gates-baseline.mjs:1-20"
gate = "../../tools/framework/tars-gates-baseline.mjs"
prova = "d=$(mktemp -d) && git -C $d init -q && printf 'try { f() } catch {}\\n' > $d/a.mjs && git -C $d add a.mjs && TARS_PROJECT=$d node .ai/gates/lint-swallow/gate.mjs"
onde = "pre-commit"

[[doctrine]]
