# Manifesto do Tars consumindo a SI MESMO (modo `self` do sync — docs/TARS.md §Modelo).
#
# O Tars e' o seu PRIMEIRO consumidor: a doutrina vale para ele primeiro (o commit
# a2f7731/cd860d1 saiu sem emoji, sem trailer e sem gate porque `.githooks/` nao existia e
# o git engoliu tudo calado — a propria falha que o `tars doctor` passou a acusar depois).
#
# Em modo `self` (projeto == catalogo) NAO ha' copia: a base JA' e' o `.ai/` do catalogo.
# O sync so' faz o wiring do harness e os hooks do git. Os itens declarados abaixo sao,
# portanto, so' os GATES e os GUARDS que o Tars usa — nao ha' `[tars].skills/rules/memory`
# a copiar para lugar nenhum (o catalogo E' a fonte desses itens).
[tars]
version = "0.0.1-dev.7"

# Governanca que o PROPRIO Tars usa (o catalogo E' a fonte; o `doctor` cobra doutrina x
# gate x prova). `novo-repo` (dev.13) e' o metodo de nascer repo — prova no consumidor.
governance = ["novo-repo"]

# Guards do agente: os que o `.claude/settings.json` do proprio Tars roda (PreToolUse).
guards = [
  "block-destructive-commands",
  "block-secret-dump",
]

[gates]
# commit-msg recebe o arquivo da mensagem (argv do hook do git); gitleaks varre o indice.
# release-guard cobra versao+CHANGELOG em commit que toca o motor (tools/framework/tars-*,
# .ai/gates, .ai/guards, .ai/governance) — o Tars e' o primeiro consumidor da propria regra.
# no-add-all fica no guard de agente, nao no hook do git.
pre-commit = ["gitleaks", "release-guard"]
commit-msg = ["commit-msg"]

# prod-guard (B1.4): o agente nao muda producao (compose/systemctl/kubectl/helm/force-push)
# sem a ordem direta do dono. Fica no PreToolUse do harness (como o no-add-all), nao no hook
# do git — o par doutrina->gate->prova esta' no `.ai/doctrines.toml`
# (`operacao/nada-em-prod-sem-ordem`).
#
# colocacao-arquivo (B1.1/B1.2) NAO entra no hook `pre-commit` do Tars: ele julga pela MATRIZ
# do projeto e o Tars (modo `self`) nao tem `config/file_placement.toml` — sem matriz o gate
# reprova por desenho (fail-closed). O par doutrina->gate->prova vive no `.ai/doctrines.toml`
# (`colocacao/matriz-de-familias`), com prova por `--arquivos`.
